services:
  claude-code:
    build:
      context: .docker
      dockerfile: Dockerfile
      args:
        CLAUDE_VERSION: latest
    image: claude-code:local
    container_name: claude-code
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
    secrets:
      - claude_credentials
      - claude_session
    volumes:
      # Mount git repo to workspace (read-write)
      - .:/workspace:delegated
      # Persist Claude config (container-only, not host ~/.claude)
      - claude-config:/home/node/.claude
      # Persist bash history
      - claude-history:/commandhistory
    working_dir: /workspace
    stdin_open: true
    tty: true

secrets:
  claude_credentials:
    file: ${HOME}/.claude/.credentials.json
  claude_session:
    file: ${HOME}/.claude.json

volumes:
  claude-config:
    name: claude-code-config
  claude-history:
    name: claude-code-history
